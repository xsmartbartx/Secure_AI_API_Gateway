# Example IAM policy definition using Rego (Open Policy Agent)

apiVersion: v1
kind: ConfigMap
metadata:
  name: iam-configmap
data:
  # opa.rego for RBAC policies
  rbac.rego: |
    package secure.iam

    # Define roles and their permissions
    role_mapping = {
      "user": ["basic_inference"],
      "analyst": ["internal_data_access"],
      "developer": ["model_testing", "deployment"],
      "admin": ["full_access"]
    }

    # Check if user has permission for a given action
    default allow = false

    allow[input.user.role == r] {
      roles = {for role in data.iam.roles : role | {role}}
      r = to_lower(role_mapping[role])
    }

